<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapport Produits Manquants</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 50%, #f59e0b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-container {
            background: white;
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border: 4px solid #fbbf24;
        }

        .logo-container img {
            max-width: 130px;
            max-height: 130px;
            object-fit: contain;
        }

        .main-title {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.1rem;
            font-weight: 400;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .main-card {
            background: white;
            border-radius: 24px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
            border-top: 6px solid #fbbf24;
        }

        .upload-section {
            text-align: center;
        }

        .depot-selector {
            margin-bottom: 30px;
            text-align: center;
        }

        .depot-selector label {
            color: #7c2d12;
            font-weight: 600;
            margin-right: 15px;
            font-size: 1.1rem;
        }

        .depot-selector select {
            padding: 12px 20px;
            font-size: 1rem;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            background: white;
            color: #7c2d12;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 150px;
        }

        .depot-selector select:hover {
            border-color: #dc2626;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.2);
        }

        .depot-selector select:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .upload-area {
            border: 3px dashed #fbbf24;
            border-radius: 16px;
            padding: 60px 40px;
            background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 100%);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #f59e0b;
            background: linear-gradient(135deg, #fde68a 0%, #fdba74 100%);
            transform: scale(1.01);
        }

        .upload-area.dragover {
            border-color: #dc2626;
            background: linear-gradient(135deg, #fde68a 0%, #fca5a5 100%);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
        }

        .upload-text {
            color: #7c2d12;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #9a3412;
            font-size: 0.95rem;
        }

        .file-input {
            display: none;
        }

        .file-name {
            margin-top: 20px;
            padding: 15px;
            background: #fef3c7;
            border-radius: 10px;
            color: #92400e;
            font-weight: 500;
            display: none;
            border-left: 4px solid #f59e0b;
        }

        .btn {
            background: linear-gradient(135deg, #dc2626 0%, #ea580c 100%);
            color: white;
            border: none;
            padding: 16px 48px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            display: inline-block;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.6);
            background: linear-gradient(135deg, #b91c1c 0%, #c2410c 100%);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .loader {
            display: none;
            margin: 30px auto;
            border: 4px solid #fed7aa;
            border-top: 4px solid #dc2626;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            display: none;
            margin-top: 40px;
        }

        .results-title {
            color: #7c2d12;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
        }

        .depot-info {
            text-align: center;
            color: #ea580c;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .result-card {
            background: linear-gradient(135deg, #fef3c7 0%, #fed7aa 100%);
            border-radius: 16px;
            padding: 25px;
            border-left: 5px solid #dc2626;
            transition: all 0.3s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(220, 38, 38, 0.2);
            border-left-width: 8px;
        }

        .result-cam {
            font-size: 1.5rem;
            font-weight: 700;
            color: #7c2d12;
            margin-bottom: 10px;
        }

        .result-count {
            color: #92400e;
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .result-count strong {
            color: #dc2626;
            font-size: 1.3rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #dc2626;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #b91c1c;
            transform: translateX(5px);
        }

        .download-all {
            text-align: center;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #fbbf24;
        }

        .download-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: white;
            padding: 18px 40px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
        }

        .download-all-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
        }

        .error-card {
            background: #fee2e2;
            border-left: 5px solid #dc2626;
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            display: none;
        }

        .error-title {
            color: #991b1b;
            font-weight: 700;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }

        .error-details {
            color: #7f1d1d;
            font-size: 0.95rem;
            white-space: pre-wrap;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-top: 10px;
        }

        @media (max-width: 768px) {
            .main-card {
                padding: 30px 20px;
            }

            .main-title {
                font-size: 2rem;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .depot-selector {
                display: flex;
                flex-direction: column;
                gap: 15px;
            }

            .depot-selector select {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo-container">
                <img src="/static/sindbad.jpg" alt="Logo" id="headerLogo">
            </div>
            <h1 class="main-title">Rapport Produits Manquants</h1>
        </div>

        <div class="main-card">
            <div class="upload-section">
                <div class="depot-selector">
                    <label for="depotSelect">Sélectionnez le Dépôt:</label>
                    <select id="depotSelect">
                        <option value="SFX">SFX</option>
                        <option value="SSE">SSE</option>
                        <option value="TUN">TUN</option>
                        <option value="BJSSE">BJSSE</option>
                        <option value="MAH">MAH</option>
                        <option value="NAB">NAB</option>
                    </select>
                </div>

                <form id="uploadForm">
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📊</div>
                        <div class="upload-text">Glissez-déposez votre fichier Excel ici</div>
                        <div class="upload-hint">ou cliquez pour parcourir (.xls, .xlsx)</div>
                        <input type="file" id="fileInput" class="file-input" accept=".xls,.xlsx" required>
                    </div>
                    <div class="file-name" id="fileName"></div>
                    <button type="submit" class="btn" id="submitBtn">
                        <span>📤 Télécharger et Analyser</span>
                    </button>
                </form>

                <div class="loader" id="loader"></div>
                <div class="error-card" id="errorCard">
                    <div class="error-title">❌ Erreur</div>
                    <div id="errorMessage"></div>
                    <div class="error-details" id="errorDetails"></div>
                </div>
            </div>

            <div class="results-section" id="resultsSection">
                <h2 class="results-title">📋 Résultats de l'Analyse</h2>
                <div class="depot-info" id="depotInfo"></div>
                <div class="results-grid" id="resultsGrid"></div>
                <div class="download-all">
                    <a href="#" class="download-all-btn" id="downloadAllBtn">
                        <span>📦</span>
                        <span>Télécharger Tous les Sites (ZIP)</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const depotSelect = document.getElementById('depotSelect');
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const uploadForm = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loader = document.getElementById('loader');
        const errorCard = document.getElementById('errorCard');
        const errorMessage = document.getElementById('errorMessage');
        const errorDetails = document.getElementById('errorDetails');
        const resultsSection = document.getElementById('resultsSection');
        const resultsGrid = document.getElementById('resultsGrid');
        const downloadAllBtn = document.getElementById('downloadAllBtn');
        const depotInfo = document.getElementById('depotInfo');
        const headerLogo = document.getElementById('headerLogo');

        // Handle logo error
        headerLogo.onerror = function() {
            this.parentElement.innerHTML = '<div style="font-size: 60px;">📊</div>';
        };

        // Click to upload
        uploadArea.addEventListener('click', () => fileInput.click());

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                fileInput.files = files;
                showFileName(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                showFileName(e.target.files[0]);
            }
        });

        function showFileName(file) {
            fileName.textContent = `📄 ${file.name}`;
            fileName.style.display = 'block';
        }

        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Reset UI
            errorCard.style.display = 'none';
            resultsSection.style.display = 'none';
            submitBtn.disabled = true;
            loader.style.display = 'block';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('depot', depotSelect.value);

            try {
                const response = await fetch('/upload/', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(JSON.stringify(errorData, null, 2));
                }

                const data = await response.json();

                // Show depot info
                depotInfo.textContent = `Dépôt sélectionné: ${data.depot}`;

                // Show results
                resultsGrid.innerHTML = '';
                data.results.forEach(result => {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.innerHTML = `
                        <div class="result-cam">${result.cam}</div>
                        <div class="result-count">
                            Produits manquants: <strong>${result.count}</strong>
                        </div>
                        <a href="${result.file}" class="download-btn">
                            <span>📄</span>
                            <span>Télécharger PDF</span>
                        </a>
                    `;
                    resultsGrid.appendChild(card);
                });

                downloadAllBtn.href = data.zip;
                resultsSection.style.display = 'block';

            } catch (error) {
                errorMessage.textContent = 'Une erreur est survenue lors du traitement du fichier.';
                errorDetails.textContent = error.message;
                errorDetails.style.display = 'block';
                errorCard.style.display = 'block';
            } finally {
                loader.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
